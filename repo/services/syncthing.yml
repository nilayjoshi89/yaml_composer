services:
  syncthing:
    profiles:
      - all
      - syncthing
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    environment:
      - TZ=Asia/Singapore
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    volumes:
      - ${SYNCTHING_PATH:?}/config:/config
      - ${SYNCTHING_PATH:?}/data:/data
    networks:
      - syncthing_network
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8384/rest/noauth/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    hostname: syncthing
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: "1.0"
networks:
  syncthing_network:
    external: true
