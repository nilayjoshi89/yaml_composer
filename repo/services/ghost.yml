services:
  ghost-app:
    image: ghost:6-alpine
    container_name: ghost-app
    restart: unless-stopped
    environment:
      - TZ=Asia/Singapore
      - database__client=mysql
      - database__connection__host=ghost-db
      - database__connection__user=ghost
      - database__connection__password=${GHOST_DB_PASSWORD:?}
      - database__connection__database=ghost
      - mail__transport=SMTP
      - mail__options__service=Mailgun
      - mail__options__auth__user=${GHOST_MAILGUN_SMTP_LOGIN:?}
      - mail__options__auth__pass=${GHOST_MAILGUN_SMTP_PASSWORD:?}
      - mail__from=${GHOST_MAIL_FROM:?}
      - url=https://${GHOST_URL:?}
    ports: []
    volumes:
      - ${GHOST_DATA:?}/content:/var/lib/ghost/content
    depends_on:
      ghost-db:
        condition: service_healthy
    networks:
      - ghost_network
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:2368/ghost/api/admin/site/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: "1.0"
  ghost-db:
    image: mysql:9.7
    container_name: ghost-db
    restart: unless-stopped
    environment:
      - TZ=Asia/Singapore
      - MYSQL_ROOT_PASSWORD=${GHOST_DB_ROOT_PASSWORD:?}
      - MYSQL_DATABASE=ghost
      - MYSQL_USER=ghost
      - MYSQL_PASSWORD=${GHOST_DB_PASSWORD:?}
    ports: []
    volumes:
      - ${GHOST_DATA:?}/db:/var/lib/mysql
    networks:
      - ghost_network
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: "1.0"
networks:
  ghost_network: null
