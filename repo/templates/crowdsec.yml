### FUNCTION CALL
# X-REF-FUNCT-TEMPLATE-CROWDSEC(X-REF-CROWDSEC-CONTAINER,X-REF-CROWDSEC-ENV,X-REF-CROWDSEC-VOLUME):
###

X-REF-FUNCT-TEMPLATE-CROWDSEC:
  #INHERIT FROM BASE TEMPLATE
  X-REF-BASE-TEMPLATE:
  image: X-REF-IMAGE-CROWDSEC
  container_name: "{X-ARG-1}"
  environment:
    - "{X-ARG-2}"
  volumes:
    - "{X-ARG-3}"
