### SAMPLE ARGUMENTS
# X-REF-CONTAINER-NAME: forgejo_app
# X-REF-ENV:
#   - USER_UID=1000
#   - USER_GID=1000
#   - FORGEJO__database__DB_TYPE=postgres
#   - FORGEJO__database__HOST=forgejo-db:5432
#   - FORGEJO__database__NAME=forgejo
#   - FORGEJO__database__USER=forgejo
#   - FORGEJO__database__PASSWD=forgejo
# X-REF-PORTS:
#   - "3000:3000"
#   - "222:2222"
# X-REF-VOLUME:
#   - .\forgejo:/var/lib/gitea
#   - /etc/localtime:/etc/localtime:ro
###

X-REF-FUNCT-TEMPLATE-FORGEJO:
  #INHERIT FROM BASE TEMPLATE
  X-REF-BASE-READONLY-TEMPLATE:
  image: X-REF-IMAGE-FORGEJO
  container_name: "{X-ARG-1}"
  user: 1000:1000
  environment:
    - "{X-ARG-2}"
  ports:
    - "{X-ARG-3}"
  volumes:
    - "{X-ARG-4}"
  healthcheck:
    test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/version" ]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
