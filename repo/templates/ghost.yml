### SAMPLE ARGUMENTS
# X-REF-GHOST-CONTAINER: ghost_web
# X-REF-GHOST-ENV:
#   - database__client=mysql
#   - database__connection__host=ghost_db
#   - database__connection__user=root
#   - database__connection__password=${GHOST_DB_PASSWORD:?}
#   - database__connection__database=ghost
#   - mail__transport=SMTP
#   - mail__options__service=Mailgun
#   - mail__options__auth__user=${GHOST_MAILGUN_SMTP_LOGIN:?}
#   - mail__options__auth__pass=${GHOST_MAILGUN_SMTP_PASSWORD:?}
#   - mail__from=${GHOST_MAIL_FROM:?}
#   - url=https://${GHOST_URL:?}
# X-REF-GHOST-PORTS: 2368:2368
# X-REF-GHOST-VOLUME:
#   - ${GHOST_DATA:?}/content:/var/lib/ghost/content
### FUNCTION CALL
# X-REF-FUNCT-TEMPLATE-GHOST(X-REF-GHOST-CONTAINER,X-REF-GHOST-ENV,X-REF-GHOST-PORTS,X-REF-GHOST-VOLUME):
###

X-REF-FUNCT-TEMPLATE-GHOST:
  #INHERIT FROM BASE TEMPLATE
  X-REF-BASE-TEMPLATE:
  image: X-REF-IMAGE-GHOST
  container_name: "{X-ARG-1}"
  environment:
    - "{X-ARG-2}"
  ports:
    - "{X-ARG-3}"
  volumes:
    - "{X-ARG-4}"
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "-q",
        "--spider",
        "http://localhost:2368/ghost/api/admin/site/",
      ]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
