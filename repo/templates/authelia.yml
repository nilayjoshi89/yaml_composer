### FUNCTION CALL
# X-REF-FUNCT-TEMPLATE-AUTHELIA(X-REF-AUTHELIA-CONTAINER,X-REF-AUTHELIA-ENV,X-REF-AUTHELIA-VOLUME):
###

X-REF-FUNCT-TEMPLATE-AUTHELIA:
  #INHERIT FROM BASE TEMPLATE
  X-REF-BASE-TEMPLATE:
  image: X-REF-IMAGE-AUTHELIA
  container_name: "{X-ARG-1}"
  environment:
    - "{X-ARG-2}"
  volumes:
    - "{X-ARG-3}"
  healthcheck:
    disable: true
