# Required environment variables:
#   FORGEJO_DATA         - Host path prefix for persistent data volumes (e.g. /mnt/data/forgejo)
#                          Subdirectories app_data and db_data will be created under this path
#   FORGEJO_DB_USER      - PostgreSQL database username
#   FORGEJO_DB_PASSWORD  - PostgreSQL database password

X-INCLUDE:
  - templates/core.yml
  - templates/image_version.yml
  - templates/forgejo.yml
  - templates/postgres.yml
X-OUTPUT: services/forgejo.yml
X-OVERRIDE:
  X-REF-FORGEJO-ENV:
    - USER_UID=1000
    - USER_GID=1000
    - FORGEJO__database__DB_TYPE=postgres
    - FORGEJO__database__HOST=forgejo-db:5432
    - FORGEJO__database__NAME=forgejo
    - FORGEJO__database__USER=${FORGEJO_DB_USER:?}
    - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD:?}
  X-REF-FORGEJO-PORTS:
    - "3000:3000"
    - "222:2222"
  X-REF-FORGEJO-VOLUME:
    - ${FORGEJO_DATA:?}/app_data:/var/lib/gitea
    - /etc/localtime:/etc/localtime:ro
  X-REF-FORGEJO-DB-ENV:
    - POSTGRES_DB=forgejo
    - POSTGRES_USER=${FORGEJO_DB_USER:?}
    - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWORD:?}
  X-REF-FORGEJO-DB-PORTS: []
  X-REF-FORGEJO-DB-VOLUME:
    - ${FORGEJO_DATA:?}/db_data:/var/lib/postgresql/data
services:
  forgejo-app:
    X-REF-FUNCT-TEMPLATE-FORGEJO("forgejo-app",X-REF-FORGEJO-ENV,X-REF-FORGEJO-PORTS,X-REF-FORGEJO-VOLUME):
    depends_on:
      forgejo-db:
        condition: service_healthy
    networks:
      - forgejo_network
  forgejo-db:
    X-REF-FUNCT-TEMPLATE-POSTGRES("forgejo-db",X-REF-FORGEJO-DB-ENV,X-REF-FORGEJO-DB-PORTS,X-REF-FORGEJO-DB-VOLUME):
    networks:
      - forgejo_network
networks:
  forgejo_network:
    external: true
